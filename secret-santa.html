<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<style>
:root{color-scheme:light dark;--bg:#f6f3ee;--card:#ffffff;--text:#222;--muted:#666;--accent:#b3261e;--border:#dcdcdc;}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1d;--card:#262629;--text:#eee;--muted:#aaa;--accent:#ff6b5b;--border:#3a3a3e;}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:560px}
h1{margin:0 0 8px;font-size:1.6rem}
.sub{margin:0 0 18px;color:var(--muted);line-height:1.45}
textarea{width:100%;min-height:200px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;resize:vertical}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
button.small{width:auto;margin:0;padding:8px 12px;font-size:.85rem;white-space:nowrap}
.error{color:var(--accent);margin-top:12px;font-size:.95rem;min-height:1em}
.row{padding:14px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.row strong{font-size:1rem}
.row input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:.78rem}
.reveal{text-align:center;padding:12px 0}
.reveal .big{font-size:2.2rem;font-weight:700;color:var(--accent);margin:18px 0}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="card" id="organizer">
  <h1>🎁 Secret Santa</h1>
  <p class="sub">Enter one name per line. Everyone gives to exactly one person and receives from exactly one person, and nobody gets themselves.</p>
  <textarea id="names" placeholder="Alex&#10;Sam&#10;Jordan"></textarea>
  <button id="draw">Draw names</button>
  <div class="error" id="error"></div>

  <div id="results" class="hidden">
    <p class="sub" style="margin-top:20px">Send each person their own link privately. Each link only shows that person's name and their Secret Santa.</p>
    <div id="links"></div>
  </div>
</div>

<div class="card hidden" id="reveal">
  <div class="reveal">
    <h1 id="greeting"></h1>
    <p class="sub">Your Secret Santa is:</p>
    <div class="big" id="santa"></div>
    <p class="sub">Keep it a secret 🤫</p>
  </div>
</div>

<script>
const enc = new TextEncoder();
const dec = new TextDecoder();

// Encode {n, s} into a URL-safe token for the hash.
function toToken(obj) {
  const bytes = enc.encode(JSON.stringify(obj));
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function fromToken(token) {
  let s = token.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const obj = JSON.parse(dec.decode(bytes));
  if (typeof obj.n !== "string" || typeof obj.s !== "string") throw new Error("bad token");
  return obj;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Shuffle, then each person gives to the next in the circle.
// This guarantees: no one gets themselves, everyone gives once, everyone receives once.
function assign(names) {
  const order = shuffle(names);
  const pairs = [];
  for (let i = 0; i < order.length; i++) {
    pairs.push({ giver: order[i], receiver: order[(i + 1) % order.length] });
  }
  return pairs;
}

function parseNames(text) {
  const names = text.split("\n").map(n => n.trim()).filter(Boolean);
  const seen = new Set();
  for (const n of names) {
    const key = n.toLowerCase();
    if (seen.has(key)) return { error: `"${n}" appears more than once. Each name must be unique.` };
    seen.add(key);
  }
  if (names.length < 3) return { error: "Please enter at least 3 names." };
  return { names };
}

function copyText(text, btn) {
  const done = () => { btn.textContent = "Copied!"; setTimeout(() => btn.textContent = "Copy", 1500); };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}

document.getElementById("draw").addEventListener("click", () => {
  const errorEl = document.getElementById("error");
  const { names, error } = parseNames(document.getElementById("names").value);
  if (error) {
    errorEl.textContent = error;
    document.getElementById("results").classList.add("hidden");
    return;
  }
  errorEl.textContent = "";

  const base = location.href.split("#")[0];
  const pairs = assign(names);
  const linksEl = document.getElementById("links");
  linksEl.textContent = "";

  pairs.forEach(({ giver, receiver }) => {
    const url = `${base}#${toToken({ n: giver, s: receiver })}`;

    const row = document.createElement("div");
    row.className = "row";

    const head = document.createElement("div");
    head.className = "row-head";

    const label = document.createElement("strong");
    label.textContent = giver;

    const btn = document.createElement("button");
    btn.className = "small";
    btn.textContent = "Copy";
    btn.addEventListener("click", () => copyText(url, btn));

    head.append(label, btn);

    const input = document.createElement("input");
    input.readOnly = true;
    input.value = url;
    input.addEventListener("focus", () => input.select());

    row.append(head, input);
    linksEl.appendChild(row);
  });

  document.getElementById("results").classList.remove("hidden");
});

// If opened with a personal link, show only that person's assignment.
(function init() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  try {
    const { n, s } = fromToken(hash);
    document.getElementById("greeting").textContent = `Hi ${n}!`;
    document.getElementById("santa").textContent = s;
    document.getElementById("organizer").classList.add("hidden");
    document.getElementById("reveal").classList.remove("hidden");
  } catch (e) {
    document.getElementById("error").textContent = "This link isn't valid.";
  }
})();
</script>
</body>
</html>
